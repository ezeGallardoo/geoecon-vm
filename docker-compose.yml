# Runtime: Colima (no Docker Desktop). Prisma habla con esta base por DATABASE_URL.
# PostGIS no entra en el Postgres 15 de Homebrew; por eso el motor espacial sigue en este servicio.

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: geoecon-db
    environment:
      POSTGRES_USER: geoecon
      POSTGRES_PASSWORD: geoecon
      POSTGRES_DB: geoecon
    ports:
      - "5435:5432"
    volumes:
      - geoecon_pg:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoecon -d geoecon"]
      interval: 5s
      timeout: 5s
      retries: 20

  ingest:
    profiles: ["tools"]
    build: ./services/ingest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://geoecon:geoecon@db:5432/geoecon
      BCRA_DEUDAS_URL: https://api.bcra.gob.ar/centraldedeudores/v1.0/Deudas/{cuit}
      IDECOR_WFS_URL: https://idecor-ws.mapascordoba.gob.ar/geoserver/idecor/wfs
      OVERPASS_URL: https://overpass-api.de/api/interpreter
    volumes:
      - ./services/ingest:/app
      - ./data:/data

volumes:
  geoecon_pg:
